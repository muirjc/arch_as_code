<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300"><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto-start-reverse"><path d="M0,0 L0,6 L9,3 z" fill="#333333" /></marker></defs><g data-edge-id="e1"><line x1="180" y1="70" x2="220" y2="70" stroke="#333333" marker-end="url(#arrowhead)" /></g><g data-edge-id="e2"><line x1="360" y1="70" x2="400" y2="70" stroke="#333333" marker-end="url(#arrowhead)" /><text x="380" y="66" text-anchor="middle" font-size="12" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' fill="#000000">Yes</text></g><g data-edge-id="e3"><line x1="360" y1="70" x2="580" y2="70" stroke="#333333" marker-end="url(#arrowhead)" /><text x="470" y="66" text-anchor="middle" font-size="12" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' fill="#000000">No</text></g><g data-edge-id="e4"><line x1="540" y1="70" x2="760" y2="70" stroke="#333333" marker-end="url(#arrowhead)" /></g><g data-edge-id="e5"><line x1="720" y1="70" x2="760" y2="70" stroke="#333333" marker-end="url(#arrowhead)" /></g><g data-node-id="order"><rect x="40" y="40" width="140" height="60" fill="#ffffff" stroke="#333333" /><text x="110" y="70" dominant-baseline="middle" text-anchor="middle" font-size="14" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' fill="#000000">Order received</text></g><g data-node-id="check"><polygon points="290,40 360,70 290,100 220,70" fill="#ffffff" stroke="#333333" /><text x="290" y="70" dominant-baseline="middle" text-anchor="middle" font-size="14" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' fill="#000000">In stock?</text></g><g data-node-id="ship"><rect x="400" y="40" width="140" height="60" fill="#ffffff" stroke="#333333" /><text x="470" y="70" dominant-baseline="middle" text-anchor="middle" font-size="14" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' fill="#000000">Ship order</text></g><g data-node-id="backorder"><rect x="580" y="40" width="140" height="60" fill="#ffffff" stroke="#333333" /><text x="650" y="70" dominant-baseline="middle" text-anchor="middle" font-size="14" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' fill="#000000">Back-order</text></g><g data-node-id="done"><rect x="760" y="40" width="140" height="60" rx="30" ry="30" fill="#ffffff" stroke="#333333" /><text x="830" y="70" dominant-baseline="middle" text-anchor="middle" font-size="14" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' fill="#000000">Done</text></g></svg>